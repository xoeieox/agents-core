[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-core"
version = "0.3.0"
description = "Shared infrastructure primitives for StarHouse Claude agents (llm, forgejo, notify, targets, comments, gpu, mem)."
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "requests",
    "pyyaml",
    "jinja2",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
test = ["pytest", "respx", "pytest-asyncio", "httpx"]

[project.scripts]
narrative-emit = "agents_core.narrative.emit:main"
mem-server = "agents_core.mem_server:main"
gpu-queue-server = "agents_core.gpu_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents_core*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
markers = [
    "integration: real backend calls (mem, chub, *-rag); run with -m integration",
    "smoke: real end-to-end dispatch through live ClaudeQueue; run with -m smoke",
]
