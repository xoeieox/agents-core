[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-core"
version = "0.1.0"
description = "Shared infrastructure primitives for StarHouse Claude agents (llm, forgejo, notify, targets, comments, gpu, mem)."
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents_core*"]
exclude = ["tests*"]
