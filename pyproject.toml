[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-core"
version = "0.3.0"
description = "Shared infrastructure primitives for the StarHouse agent fleet: LLM plumbing, Forgejo client, notifications, targets/comments, GPU queue, memory (SQLite+FTS5), shaped agent execution, doorman leases, slots, and thin FastAPI servers over the mem and gpu modules."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx",
    "requests",
    "pyyaml",
    "jinja2",
    "fastapi",
    "uvicorn[standard]",
    "psutil>=5.9",
    "mcp>=1.0,<2.0",
    "cryptography>=41",
]

[project.optional-dependencies]
test = ["pytest", "respx", "pytest-asyncio", "httpx", "pytest-timeout"]

[project.scripts]
narrative-emit = "agents_core.narrative.emit:main"
mem-server = "agents_core.mem_server:main"
mem-cli = "agents_core.mem_cli:main"
gpu-queue-server = "agents_core.gpu_server:main"
slot-server = "agents_core.slot_server:main"
keeper-query = "agents_core.keeper_query:main"
dowser-server = "agents_core.dowser_server:main"
elevator-interactive-server = "agents_core.elevator_interactive_worker:main"
shared-deliberation-server = "agents_core.shared_deliberation.service:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents_core*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"agents_core.room_paths" = ["*.toml"]
"agents_core" = ["data/*.yaml", "config/*.json"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
markers = [
    "integration: real backend calls (mem, chub, *-rag); run with -m integration",
    "smoke: real end-to-end dispatch through live ClaudeQueue; run with -m smoke",
]
addopts = "-m 'not smoke'"
timeout = 20
timeout_method = "signal"
