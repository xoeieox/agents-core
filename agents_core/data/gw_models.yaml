# Canonical GW model-name registry (gw-serving-state-resolver-v0).
#
# Stable alias facts ONLY — never live serving/mode state. One row per model;
# lookup by any alias (canonical_id / display_label / operator_alias / mode_alias)
# must return the same row. Loaded once at import by agents_core.llm; a malformed
# or absent file raises GwRegistryError (loud deploy-time failure).
#
# canonical_id    — the served /v1/models id (authoritative key)
# mode_alias      — the flip-controller mode this model implies
# operator_alias  — the OPERATOR_DEFAULTS class this model belongs to
# display_label   — the flip-controller model_label (decorative-but-registered)
# weights_hint    — substring of the gguf/weights path, for humans

models:
  - canonical_id: gravitywell-122b
    mode_alias: big
    operator_alias: gravitywell
    display_label: qwen3.5-122b-a10b
    weights_hint: "Qwen3.5-122B-A10B"

  # Second "big" seat member (agents-core-doorman-big-seat-membership-v0):
  # the big seat is a registry-declared mode_alias, not a single model's
  # identity — this row is what lets the doorman recognise V4-Flash as a
  # valid big-seat occupant without a code change. gravitywell-122b remains
  # the stock/default member (see GW_BIG_MODEL_ID in doorman_server.py).
  - canonical_id: gravitywell-v4flash
    mode_alias: big
    operator_alias: gravitywell
    display_label: deepseek-v4-flash
    weights_hint: "DeepSeek-V4-Flash"

  # dual-coder topology (ratified 2026-07-30 as GravityWell's home posture,
  # agents-core-doorman-serving-mode-topology-truthful-v0) — slot1 :8081 nvfp4,
  # slot2 :8082 coder. Both imply mode_alias "dual"; a lookup keyed on either
  # served id resolves unknown_model=False so gw_serving_state() can tell
  # "dual" apart from "unknown" on this box.
  - canonical_id: gravitywell-a3b-nvfp4
    mode_alias: dual
    operator_alias: gravitywell
    display_label: qwen3.6-35b-a3b-nvfp4
    weights_hint: "Qwen3.6-35B-A3B-NVFP4"
  - canonical_id: gravitywell-a3b-coder
    mode_alias: dual
    operator_alias: gravitywell
    display_label: qwen3.6-35b-a3b-fp8-coder
    weights_hint: "Qwen3.6-35B-A3B-FP8-dynamic"

  # 27B solo posture (agents-core-gw-models-register-27b-seat-v0) — the live
  # served id on GW's most common posture, unregistered until this row.
  # mode_alias "solo" matches gw_phase_models.py's existing "solo" ->
  # "gravitywell-27b" vocabulary; NOT "big" (would silently join
  # gw_big_seat_members() and flip serving_is_big True on a solo posture)
  # and NOT "dual" (would misreport _topology_serving_mode). Appended at
  # END OF FILE — _gw_registry_lookup matches in file order and returns the
  # first hit, so appending here keeps every existing lookup byte-identical.
  - canonical_id: gravitywell-27b
    mode_alias: solo
    operator_alias: gravitywell
    display_label: qwen3.8-27b-nvfp4
    weights_hint: "Qwen3.8-27B-NVFP4"

  # Flash-Next whole-card seat (flashnext-big-class-cockpit-trigger-v0, Leg 2) —
  # the on-demand SGLang ssd-stream seat on :30000 (flashnext-seat start|stop on
  # GravityWell), registered as a "big"-class member so it is a first-class
  # member of the big class in the registry (gw_big_seat_members() reads this
  # live). canonical_id is the live served_model_name measured 2026-09-03 from
  # :30000/get_server_info (mem infra/gw-flashnext-seat-served-context-ceiling-
  # 2026-09-03; the SGLang /v1/models id equals the served_model_name).
  # INERT TODAY: the doorman probes :8081/:8082 only, not :30000 — this row is
  # classification-only until the doorman/keeper :30000-awareness unit lands
  # (Known deferred in the spec). Appended at END OF FILE — _gw_registry_lookup
  # matches in file order and returns the first hit, so lookup("big") and
  # lookup("gravitywell") still resolve to the 122b row (first hit); only
  # canonical_id and display_label are unique to this row.
  - canonical_id: Qwen3.8-Flash-Next-NVFP4-SSD-Stream
    mode_alias: big
    operator_alias: gravitywell
    display_label: "Qwen3.8 Flash-Next (NVFP4, SSD-stream)"
    weights_hint: "/data/models/sglang-ssd-stream/huggingface/hub/models--garnermccloud--Qwen3.8-Flash-Next-NVFP4-SSD-Stream"

  # Gemma-4-31B heretic solo posture (conductor-gw-roster-v0 D3 / PR 2) — the
  # flip-tested creative seat (ops/gw-slot1-gemma4-31b-heretic-flip-test-2026-09-08).
  # mode_alias "solo" (NOT "big"): the same trap as the 27B row — "big" would
  # join gw_big_seat_members() and flip serving_is_big on a solo posture.
  # Appended at END OF FILE — _gw_registry_lookup matches in file order and
  # returns the first hit, so lookup("solo") and lookup("gravitywell") still
  # resolve to the 27B row (first hit); only canonical_id and display_label
  # are unique to this row.
  - canonical_id: gravitywell-gemma4-31b
    mode_alias: solo
    operator_alias: gravitywell
    display_label: gemma-4-31b-heretic-nvfp4
    weights_hint: "gemma-4-31B-it-heretic-NVFP4"
