target: radio-op
invariants:
  - id: i01_consult_log_row_per_judgment
    description: "Every ingest that reached the Qwen judge appends exactly one row to consult-log JSONL"
    dimension: row_count_delta
    expected: 1
    tolerance: 0
    proposed_by: Erah
    provisional: false
    check: agents_core.friction_test.invariants_impl.radio_op.i01_consult_log_row_per_judgment
    qwen_check: null

  - id: i02_authority_tier_host_determined
    description: "Surfaced fragments' authority_tier matches map_authority_tier over their ID prefix; no Qwen-overridden values"
